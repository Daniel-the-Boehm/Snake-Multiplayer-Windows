name: Build Snake.exe

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach Snake.exe to
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pygame pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon snake.ico --collect-all pygame --exclude-module tkinter --name Snake snake.py

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/Snake.exe --clobber
